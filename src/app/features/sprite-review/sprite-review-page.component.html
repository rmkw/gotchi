<section class="sprite-review-page mx-auto min-h-screen w-full max-w-6xl px-3 py-3 text-slate-100 sm:px-4 sm:py-4">
  <header class="mb-3 flex items-start justify-between gap-3 rounded-lg border border-white/10 bg-slate-950/80 p-4">
    <div>
      <p class="text-[10px] uppercase tracking-[0.28em] text-cyan-300/80">sprite review</p>
      <h1 class="mt-1 text-xl font-black tracking-tight">Comparador de animaciones</h1>
    </div>

    <a routerLink="/"
      class="shrink-0 rounded-lg bg-white/10 px-3 py-2 text-xs font-semibold text-slate-100 transition hover:bg-white/20">
      Volver
    </a>
  </header>

  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">
    @for (sprite of sprites; track sprite.mood) {
    <article class="rounded-lg border border-white/10 bg-slate-900/70 p-2">
      <div class="mb-2 rounded-lg bg-white/5 px-3 py-2 text-xs font-semibold uppercase tracking-[0.18em] text-slate-300">
        {{ sprite.label }}
      </div>

      <div class="grid gap-2">
        <div class="pet-stage relative overflow-hidden rounded-lg border border-cyan-400/20 bg-slate-950"
          [style.background-image]="'url(' + sceneBackgrounds.day + ')'">
          <div class="pet-sprite" [style.background-image]="'url(' + sprite.spriteSheetUrl + ')'"
            [style.background-position]="spriteBackgroundPosition()" [style.aspect-ratio]="sprite.aspectRatio"
            [class.pet-sprite-happy]="sprite.mood === 'happy'"
            [class.pet-sprite-sleepy]="sprite.mood === 'sleepy'"
            [class.pet-sprite-sleeping]="sprite.mood === 'sleeping'"
            [class.pet-sprite-dirty]="sprite.mood === 'dirty'" [class.pet-sprite-sick]="sprite.mood === 'sick'"
            role="img" [attr.aria-label]="sprite.label + ' día'"></div>

          <div class="stage-label">día</div>
        </div>

        <div class="pet-stage relative overflow-hidden rounded-lg border border-cyan-400/20 bg-slate-950"
          [style.background-image]="'url(' + sceneBackgrounds.night + ')'">
          <div class="pet-sprite" [style.background-image]="'url(' + sprite.spriteSheetUrl + ')'"
            [style.background-position]="spriteBackgroundPosition()" [style.aspect-ratio]="sprite.aspectRatio"
            [class.pet-sprite-happy]="sprite.mood === 'happy'"
            [class.pet-sprite-sleepy]="sprite.mood === 'sleepy'"
            [class.pet-sprite-sleeping]="sprite.mood === 'sleeping'"
            [class.pet-sprite-dirty]="sprite.mood === 'dirty'" [class.pet-sprite-sick]="sprite.mood === 'sick'"
            role="img" [attr.aria-label]="sprite.label + ' noche'"></div>

          <div class="stage-label">noche</div>
        </div>
      </div>
    </article>
    }

    @for (item of deadItems; track item.period) {
    <article class="rounded-lg border border-white/10 bg-slate-900/70 p-2">
      <div class="mb-2 rounded-lg bg-white/5 px-3 py-2 text-xs font-semibold uppercase tracking-[0.18em] text-slate-300">
        {{ item.label }}
      </div>

      <div class="pet-stage relative overflow-hidden rounded-lg border border-cyan-400/20 bg-slate-950">
        <img class="pet-scene-image" [src]="item.imageUrl" [alt]="item.label" />
      </div>
    </article>
    }
  </div>
</section>
